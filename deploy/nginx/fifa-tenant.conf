# Nginx site config for FCC + Mandrake on one EC2 instance.
#
# Amazon Linux (recommended):
#   ./scripts/configure-nginx.sh 203-0-113-10
#
# Manual:
#   sed "s/EC2_IP_DASHED/203-0-113-10/g" deploy/nginx/fifa-tenant.conf | sudo tee /etc/nginx/conf.d/fifa.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fcc.203-0-113-10.sslip.io -d mandrake.203-0-113-10.sslip.io

# FCC
server {
    listen 80;
    server_name fcc.EC2_IP_DASHED.sslip.io;

    root /var/www/fifa/fcc/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Mandrake
server {
    listen 80;
    server_name mandrake.EC2_IP_DASHED.sslip.io;

    root /var/www/fifa/mandrake/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
